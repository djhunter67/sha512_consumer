[package]
name = "sha512-hasher"
version = "0.1.0"
edition = "2021"
authors = ["Hunter, Christerpher <djhunter67@gmail.com>"]


[profile.release]
debug = false
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "s"

[dependencies]
c_in_rust = { git = "https://github.com/djhunter67/sha512_genny.git" }

[dev-dependencies]
rstest = "0.24.0"
